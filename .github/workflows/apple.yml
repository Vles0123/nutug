name: Apple app checks
on:
  push:
    paths:
      [
        'apple/**',
        'src/**',
        'shared/**',
        'scripts/build*.mjs',
        'tests/native/**',
        'scripts/native-render-check.mjs',
        'content-source/data.js',
        'package*.json',
        '.github/workflows/apple.yml',
      ]
  pull_request:
    paths:
      [
        'apple/**',
        'src/**',
        'shared/**',
        'scripts/build*.mjs',
        'tests/native/**',
        'scripts/native-render-check.mjs',
        'content-source/data.js',
        'package*.json',
        '.github/workflows/apple.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      matrix:
        scheme: [NutugCalendar, NutugHistory]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - name: Native calendar reference dates
        run: |
          xcrun swiftc apple/Nutug/CalendarEngine.swift apple/Nutug/Orthography.swift tests/native/CalendarChecks.swift -o "$RUNNER_TEMP/calendar-check"
          "$RUNNER_TEMP/calendar-check" "$PWD"
      - name: Native schedule recurrence and calendar files
        run: |
          xcrun swiftc apple/Nutug/CalendarEngine.swift tests/native/ScheduleChecks.swift -o "$RUNNER_TEMP/schedule-check"
          "$RUNNER_TEMP/schedule-check" "$PWD"
      - name: macOS build
        run: xcodebuild -project apple/Nutug.xcodeproj -scheme "${{ matrix.scheme }}" -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/nutug-mac" CODE_SIGNING_ALLOWED=NO build
      - name: iPhone and iPad build
        run: xcodebuild -project apple/Nutug.xcodeproj -scheme "${{ matrix.scheme }}" -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/nutug-ios" CODE_SIGNING_ALLOWED=NO build
      - name: Native persistence and rendered screens
        if: matrix.scheme == 'NutugCalendar'
        run: |
          npm run build:content
          node scripts/native-render-check.mjs
